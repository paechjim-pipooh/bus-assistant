<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B.U.S. assist PIPOOH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#03080f;--cyan:#23d5ff;--cyan-soft:rgba(35,213,255,.18);
  --line:rgba(35,213,255,.35);--mint:#3ff5d8;--text:#eaf8ff;--muted:#7fb6d6;
  --panel:rgba(6,22,40,.72);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Prompt',system-ui,sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(ellipse at 15% 12%,rgba(120,60,200,.28),transparent 45%),radial-gradient(ellipse at 88% 55%,rgba(20,130,220,.22),transparent 50%),radial-gradient(ellipse at top,#0b1a3a 0%,#02040c 70%) #02040c}
.app{position:relative;width:100%;max-width:440px;min-height:100vh;padding:0 14px 100px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);overflow:hidden}
.grid-bg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(35,213,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(35,213,255,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(#000,transparent 70%)}

/* header */
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0 12px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:none;background:none;color:var(--cyan);font-size:20px;cursor:pointer;border-radius:10px}
.brand{text-align:center}
.brand h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;letter-spacing:9px;text-shadow:0 0 12px rgba(35,213,255,.7)}
.brand p{font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:3px;color:var(--muted);margin-top:2px}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--cyan);display:grid;place-items:center;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--cyan);box-shadow:0 0 12px rgba(35,213,255,.5)}

/* hero with big globe */
.hero{position:relative;height:570px;margin:0 -14px}
.hero-text{position:absolute;left:18px;top:14px;z-index:2}
.tagline{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;color:var(--cyan)}
.greet{font-size:21px;font-weight:600;margin-top:8px;line-height:1.3}
.greet span{color:var(--cyan)}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.user-card{position:absolute;left:18px;top:14px;z-index:2;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 0 12px rgba(35,213,255,.15)}
.user-card img{width:40px;height:40px;border-radius:9px;object-fit:cover;object-position:center 20%;border:1px solid var(--cyan)}
.user-name{font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:1px;color:var(--muted)}
.user-name span{color:var(--text);font-weight:700}
.clock{position:absolute;right:18px;top:14px;text-align:right;z-index:2}
.clock .time{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:500;text-shadow:0 0 14px rgba(35,213,255,.6)}
.clock .date{font-size:11.5px;margin-top:2px}
.clock .tz{font-size:10px;color:var(--cyan)}
#globe{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:560px;height:560px;max-width:none}
.hero-title{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:22px;letter-spacing:10px;color:#dff7ff;text-shadow:0 0 14px var(--cyan);z-index:2}

/* voice commander */
.voice{display:flex;flex-direction:column;align-items:center;margin-top:-6px;position:relative;z-index:3}
.mic{width:76px;height:76px;border-radius:50%;border:2px solid var(--mint);background:radial-gradient(circle,rgba(63,245,216,.45) 0%,rgba(35,213,255,.2) 55%,rgba(5,24,46,.95) 100%);color:var(--mint);font-size:26px;cursor:pointer;box-shadow:0 0 22px rgba(63,245,216,.5),inset 0 0 12px rgba(63,245,216,.35);transition:all .25s}
.mic:hover{transform:scale(1.06)}
.mic.listening{background:var(--mint);color:#020813;box-shadow:0 0 40px var(--mint),0 0 60px rgba(63,245,216,.7);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px;text-align:center}
.reply{margin-top:10px;display:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(4,18,34,.85);font-size:13px;line-height:1.6;width:100%}
.reply.show{display:block}
.reply strong{color:var(--mint)}
.textin{position:relative;width:100%;margin-top:10px}
.textin input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(4,18,34,.9);color:var(--text);font-family:inherit;font-size:14px;padding:0 48px 0 16px;outline:none}
.textin input::placeholder{color:var(--muted)}
.textin button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--cyan);font-size:16px;cursor:pointer}

/* music panel */
.panel{position:relative;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 11px;box-shadow:inset 0 0 22px rgba(35,213,255,.06)}
.panel-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:6px}
.panel-head i{color:var(--cyan)}
.eq{margin-left:auto;display:flex;align-items:flex-end;gap:3px;height:18px}
.eq i{width:3px;height:4px;background:var(--cyan);border-radius:2px}
.playing .eq i{animation:bounce .4s infinite alternate}
.playing .eq i:nth-child(2){animation-delay:.15s}.playing .eq i:nth-child(3){animation-delay:.3s}.playing .eq i:nth-child(4){animation-delay:.1s}
@keyframes bounce{to{height:16px;background:var(--mint)}}
.track{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-track{font-size:11.5px;color:var(--muted);margin-top:2px}
.seek{width:100%;height:5px;background:rgba(35,213,255,.12);border-radius:4px;margin-top:8px;cursor:pointer;position:relative;overflow:hidden}
.seek i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#1ea8d6,var(--mint));box-shadow:0 0 8px rgba(35,213,255,.6);width:0}
.times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ctl{background:none;border:1px solid var(--line);color:var(--cyan);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:11px}
.ctl:hover{border-color:var(--mint);color:var(--mint)}
.ctl.main{width:40px;height:40px;background:linear-gradient(135deg,var(--cyan),var(--mint));color:#020813;border:none;font-size:18px;box-shadow:0 0 16px rgba(63,245,216,.6)}
.vol{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--cyan)}
.vol input{flex:1;accent-color:#23d5ff}
.tracks{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tchip{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer;font-family:inherit}
.tchip.on{background:var(--cyan-soft);border-color:var(--mint);color:var(--mint)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:72px;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around;align-items:center;background:rgba(3,10,20,.94);border-top:1px solid var(--line);z-index:10}
.nav button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 10px;border-radius:12px;min-width:70px}
.nav button i{font-size:19px}
.nav button.active{color:var(--mint);border:1px solid var(--line);background:rgba(35,213,255,.08);box-shadow:0 0 14px rgba(35,213,255,.25)}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(6,22,40,.95);border:1px solid var(--cyan);padding:8px 14px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

      <button aria-label="send" onclick="handleCommand(document.getElementById('q').value)"><i class="fas fa-paper-plane"></i></button>
    </div>
  </section>

  <section class="panel" id="music">
    <div class="panel-head"><i class="fas fa-compact-disc"></i>เครื่องเล่นเพลง<div class="eq" id="eq"><i></i><i></i><i></i><i></i></div></div>
    <div class="track" id="trackTitle">Chill Synthwave</div>
    <div class="sub-track" id="trackSub">เพลงสนุกๆ สำหรับน้อง PIPOOH</div>
    <div class="seek" id="seek" onclick="seekTo(event)"><i id="seekFill"></i></div>
    <div class="times"><span id="cur">00:00</span><span id="dur">00:00</span></div>
    <div class="controls">
      <button class="ctl" onclick="prevTrack()" aria-label="previous"><i class="fas fa-backward-step"></i></button>
      <button class="ctl" onclick="pulseBack()" aria-label="back 5s"><i class="fas fa-rotate-left"></i></button>
      <button class="ctl main" id="playBtn" onclick="togglePlay()" aria-label="play"><i class="fas fa-play" id="playIcon"></i></button>
      <button class="ctl" onclick="pulseFwd()" aria-label="forward 5s"><i class="fas fa-rotate-right"></i></button>
      <button class="ctl" onclick="nextTrack()" aria-label="next"><i class="fas fa-forward-step"></i></button>
    </div>
    <div class="vol"><i class="fas fa-volume-high"></i><input type="range" min="0" max="100" value="60" oninput="setVolume(this.value)"><span id="volText">60</span></div>
    <div class="tracks" id="trackList"></div>
  </section>
</div>

<nav class="nav">
  <button class="active" onclick="goTab('home',this)"><i class="fas fa-house"></i>Home</button>
  <button onclick="goTab('voice',this)"><i class="fas fa-microphone"></i>Voice</button>
  <button onclick="goTab('music',this)"><i class="fas fa-music"></i>Music</button>
  <button onclick="goTab('settings',this)"><i class="fas fa-gear"></i>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const thDays=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const thMonths=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');

/* clock */
function tick(){
  const n=new Date();
  $('clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
  $('thaiDate').textContent=`${thDays[n.getDay()]} ${n.getDate()} ${thMonths[n.getMonth()]} ${n.getFullYear()+543}`;
}
tick();setInterval(tick,1000);

let toastTimer;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* starfield background */
(function(){
  const c=$('stars'),x=c.getContext('2d');let w,h,S=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;S=Array.from({length:Math.round(w*h/2800)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.2,s:Math.random()*.02+.004,a:Math.random()*6}));}
  resize();addEventListener('resize',resize);
  (function frame(){
    x.clearRect(0,0,w,h);
    for(const s of S){s.a+=s.s;x.globalAlpha=.35+.65*Math.abs(Math.sin(s.a));x.fillStyle=s.r>1.1?'#cdf6ff':'#ffffff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}
    x.globalAlpha=1;requestAnimationFrame(frame);
  })();
})();

/* globe: larger rotating dotted sphere with orbit ring and satellite */
const cv=$('globe'),ctx=cv.getContext('2d');
const N=700,pts=[];
for(let i=0;i<N;i++){
  const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=Math.PI*(3-Math.sqrt(5))*i;
  pts.push({x:Math.cos(t)*r,y,z:Math.sin(t)*r});
}
let rot=0,sat=0;
function drawGlobe(){
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=W*0.25;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(cx,cy,R*0.6,cx,cy,R*1.6);
  g.addColorStop(0,'rgba(35,213,255,0.2)');g.addColorStop(1,'rgba(35,213,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.6,0,Math.PI*2);ctx.fill();

  rot+=0.004;
  const cr=Math.cos(rot),sr=Math.sin(rot);
  for(const p of pts){
    const x=p.x*cr+p.z*sr,z=-p.x*sr+p.z*cr,d=(z+1)/2,a=0.25+d*0.75;
    ctx.fillStyle=`rgba(${d>0.5?'140,240,255':'35,180,255'},${a})`;
    ctx.beginPath();ctx.arc(cx+x*R,cy+p.y*R,1.6+d*1.4,0,Math.PI*2);ctx.fill();
  }
  ctx.lineWidth=1;
  for(let k=1;k<=5;k++){
    const lat=(k/6)*Math.PI-Math.PI/2;
    ctx.beginPath();
    for(let s=0;s<=72;s++){
      const lon=(s/72)*Math.PI*2+rot;
      const px=cx+Math.cos(lat)*Math.cos(lon)*R,py=cy+Math.sin(lat)*R;
      s?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.strokeStyle='rgba(35,213,255,0.14)';ctx.stroke();
  }
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-0.25);ctx.scale(1,0.32);
  ctx.beginPath();ctx.arc(0,0,R*1.45,0,Math.PI*2);
  ctx.strokeStyle='rgba(63,245,216,0.7)';ctx.lineWidth=3;
  ctx.shadowColor='#23d5ff';ctx.shadowBlur=14;ctx.stroke();ctx.restore();

  sat+=0.02;
  const ex=Math.cos(sat)*R*1.45,ey=Math.sin(sat)*R*1.45*0.32,c=Math.cos(-0.25),s=Math.sin(-0.25);
  ctx.shadowBlur=20;ctx.shadowColor='#3ff5d8';
  ctx.fillStyle='#e6fffb';ctx.beginPath();ctx.arc(cx+ex*c-ey*s,cy+ex*s+ey*c,5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  requestAnimationFrame(drawGlobe);
}
drawGlobe();

/* music: real synthesized playback via Web Audio (no external files needed) */
const TRACKS=[
  {name:'Chill Synthwave',sub:'เพลงสนุกๆ สำหรับน้อง PIPOOH',tempo:110,root:220,scale:[0,3,7,10,12,7,3,0],bass:[0,0,5,5]},
  {name:'Sunny Bounce',sub:'จังหวะสดใส ฟังแล้วอารมณ์ดี',tempo:128,root:262,scale:[0,4,7,12,7,4,9,7],bass:[0,0,7,5]},
  {name:'Space Lullaby',sub:'เบาๆ ก่อนนอน',tempo:90,root:196,scale:[0,2,5,7,9,12,9,7],bass:[0,-3,-5,-3]}
];
const STEPS=64;
let ac=null,master=null,ti=0,playing=false,stepIdx=0,nextTime=0,sched=null,posSec=0;

function ensureAudio(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=(window._vol??0.6)*0.9;master.connect(ac.destination);
  }
  if(ac.state==='suspended') ac.resume();
}
function stepDur(){return 60/TRACKS[ti].tempo/4;}
function loopDur(){return STEPS*stepDur();}
function tone(freq,time,dur,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,time);
  g.gain.linearRampToValueAtTime(vol,time+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,time+dur);
  o.connect(g);g.connect(master);o.start(time);o.stop(time+dur+0.05);
}
function scheduleStep(){
  const tr=TRACKS[ti],sd=stepDur(),st=stepIdx%STEPS;
  const midi=f=>f;
  if(st%2===0){
    const semi=tr.scale[(st/2)%tr.scale.length];
    tone(tr.root*Math.pow(2,semi/12),nextTime,sd*1.8,'triangle',0.18);
  }
  if(st%8===0){
    const semi=tr.bass[(st/8)%tr.bass.length];
    tone(tr.root/2*Math.pow(2,semi/12),nextTime,sd*6,'sawtooth',0.12);
  }
  if(st%4===2) tone(1200,nextTime,0.05,'square',0.03);
  nextTime+=sd;stepIdx++;
}
function runScheduler(){
  while(nextTime<ac.currentTime+0.15){scheduleStep();}
  posSec=(stepIdx*stepDur())%loopDur();
  updateUI();
}
function startPlay(){
  ensureAudio();
  playing=true;
  nextTime=ac.currentTime+0.05;
  sched=setInterval(runScheduler,40);
  setPlayUI(true);
}
function stopPlay(){
  playing=false;
  clearInterval(sched);sched=null;
  setPlayUI(false);
}
function togglePlay(){playing?stopPlay():startPlay();}
function setPlayUI(on){
  $('playIcon').className=on?'fas fa-pause':'fas fa-play';
  $('playBtn').setAttribute('aria-label',on?'pause':'play');
  $('eq').parentElement.classList.toggle('playing',on);
}
function loadTrack(i){
  ti=(i+TRACKS.length)%TRACKS.length;
  stepIdx=0;posSec=0;
  $('trackTitle').textContent=TRACKS[ti].name;
  $('trackSub').textContent=TRACKS[ti].sub;
  $('dur').textContent=fmt(loopDur());
  document.querySelectorAll('.tchip').forEach((b,k)=>b.classList.toggle('on',k===ti));
  if(ac){nextTime=ac.currentTime+0.05;}
  updateUI();
}
function selectTrack(i){loadTrack(i);if(!playing)startPlay();}
function nextTrack(){loadTrack(ti+1);if(playing){stopPlay();startPlay();}}
function prevTrack(){loadTrack(ti-1);if(playing){stopPlay();startPlay();}}
function seekTo(e){
  const r=$('seek').getBoundingClientRect();
  const p=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);
  jumpTo(p*loopDur());
}
function jumpTo(sec){
  sec=((sec%loopDur())+loopDur())%loopDur();
  stepIdx=Math.floor(sec/stepDur());
  posSec=stepIdx*stepDur();
  if(ac)nextTime=ac.currentTime+0.05;
  updateUI();
}
function pulseBack(){jumpTo(posSec-5);}
function pulseFwd(){jumpTo(posSec+5);}
function setVolume(v){
  $('volText').textContent=v;
  if(master)master.gain.value=v/100*0.9;
  else window._vol=v/100;
}
function fmt(s){return `${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}`;}
function updateUI(){
  const L=loopDur();
  $('cur').textContent=fmt(posSec);
  $('seekFill').style.width=(posSec/L*100)+'%';
}

/* voice commander + text commands */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='th-TH';u.rate=1;
  speechSynthesis.speak(u);
}
function showReply(html){const r=$('reply');r.innerHTML=html;r.classList.add('show');}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setVol(delta){
  const el=document.querySelector('.vol input');
  el.value=Math.min(100,Math.max(0,+el.value+delta));setVolume(el.value);
  return `ระดับเสียง ${el.value} ครับ`;
}
function handleCommand(raw){
  const text=(raw||'').trim();
  if(!text) return;
  $('q').value='';
  const t=text.replace(/\s+/g,'');
  const now=new Date();
  let ans;
  if(/เล่นเพลง|เปิดเพลง|เล่นต่อ/.test(t)){ if(!playing)startPlay(); ans=`กำลังเล่น ${TRACKS[ti].name} ครับ`; }
  else if(/หยุดเพลง|พักเพลง|หยุดก่อน/.test(t)){ stopPlay(); ans='หยุดเพลงแล้วครับ'; }
  else if(/เพลงถัดไป|เพลงต่อไป|ข้ามเพลง/.test(t)){ nextTrack(); ans=`เปลี่ยนเป็น ${TRACKS[ti].name} ครับ`; }
  else if(/เพลงก่อน/.test(t)){ prevTrack(); ans=`เปลี่ยนเป็น ${TRACKS[ti].name} ครับ`; }
  else if(/เสียงดังขึ้น|เพิ่มเสียง|ดังขึ้น/.test(t)) ans=setVol(10);
  else if(/เสียงเบาลง|ลดเสียง|เบาลง/.test(t)) ans=setVol(-10);
  else if(/กี่โมง|เวลา/.test(t)) ans=`ตอนนี้เวลา ${$('clock').textContent} น. ครับ`;
  else if(/วันอะไร|วันที่/.test(t)) ans=`วันนี้วัน${thDays[now.getDay()]} ที่ ${now.getDate()} ${thMonths[now.getMonth()]} ${now.getFullYear()+543} ครับ`;
  else if(/สวัสดี|หวัดดี/.test(t)) ans='สวัสดีครับ น้อง PIPOOH! พี่ B.U.S. พร้อมช่วยเสมอครับ';
  else { askAI(text); return; }
  showReply(`<strong>น้อง PIPOOH:</strong> ${escapeHtml(text)}<br><strong>B.U.S.:</strong> ${ans}`);
  speak(ans);
}
const chatHistory = [];
async function askAI(text){
  showReply(`<strong>น้อง PIPOOH:</strong> ${escapeHtml(text)}<br><strong>B.U.S.:</strong> กำลังคิดคำตอบ...`);
  try{
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: text, history: chatHistory })
    });
    const data = await res.json();
    const ans = data.reply || 'ขอโทษครับ ตอนนี้ตอบไม่ได้';
    chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: ans });
    if (chatHistory.length > 20) chatHistory.splice(0, chatHistory.length - 20);
    showReply(`<strong>น้อง PIPOOH:</strong> ${escapeHtml(text)}<br><strong>B.U.S.:</strong> ${escapeHtml(ans)}`);
    speak(ans);
  }catch(e){
    showReply(`<strong>B.U.S.:</strong> เชื่อมต่อไม่ได้ครับ ลองใหม่อีกครั้งนะ`);
  }
}
let rec=null,listening=false;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ $('status').textContent='เบราว์เซอร์นี้ไม่รองรับการฟังเสียง ใช้ช่องพิมพ์แทนได้ครับ'; return; }
  if(listening){ rec&&rec.stop(); return; }
  ensureAudio();
  rec=new SR();
  rec.lang='th-TH';rec.continuous=false;rec.interimResults=false;
  rec.onstart=()=>{listening=true;$('mic').classList.add('listening');$('status').textContent='กำลังฟังอยู่ครับ พูดได้เลย...';};
  rec.onresult=e=>handleCommand(e.results[0][0].transcript);
  rec.onerror=()=>{$('status').textContent='ฟังไม่ชัด ลองแตะไมค์แล้วพูดอีกทีนะครับ';};
  rec.onend=()=>{listening=false;$('mic').classList.remove('listening');if($('status').textContent.startsWith('กำลังฟัง'))$('status').textContent='แตะไมค์แล้วพูดคำสั่งได้เลยครับ';};
  rec.start();
}

function goTab(tab,btn){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='home') window.scrollTo({top:0,behavior:'smooth'});
  else if(tab==='voice'){ window.scrollTo({top:0,behavior:'smooth'}); toggleMic(); }
  else if(tab==='music') $('music').scrollIntoView({behavior:'smooth',block:'start'});
  else toast('การตั้งค่ากำลังพัฒนาครับ');
}

$('trackList').innerHTML=TRACKS.map((t,i)=>`<button class="tchip" onclick="selectTrack(${i})">${t.name}</button>`).join('');
loadTrack(0);
</script>
