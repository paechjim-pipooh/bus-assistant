<!DOCTYPE html>
<html lang="th">
<head>   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B.U.S. assist PIPOOH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#03080f;--cyan:#23d5ff;--cyan-soft:rgba(35,213,255,.18);
  --line:rgba(35,213,255,.35);--mint:#3ff5d8;--text:#eaf8ff;--muted:#7fb6d6;
  --panel:rgba(6,22,40,.72);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Prompt',system-ui,sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(ellipse at 15% 12%,rgba(120,60,200,.28),transparent 45%),radial-gradient(ellipse at 88% 55%,rgba(20,130,220,.22),transparent 50%),radial-gradient(ellipse at top,#0b1a3a 0%,#02040c 70%) #02040c}
.app{position:relative;width:100%;max-width:440px;min-height:100vh;padding:0 14px 100px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);overflow:hidden}
.grid-bg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(35,213,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(35,213,255,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(#000,transparent 70%)}

/* header */
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0 12px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:none;background:none;color:var(--cyan);font-size:20px;cursor:pointer;border-radius:10px}
.brand{text-align:center}
.brand h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;letter-spacing:9px;text-shadow:0 0 12px rgba(35,213,255,.7)}
.brand p{font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:3px;color:var(--muted);margin-top:2px}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--cyan);display:grid;place-items:center;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--cyan);box-shadow:0 0 12px rgba(35,213,255,.5)}

/* hero with big globe */
.hero{position:relative;height:570px;margin:0 -14px}
.hero-text{position:absolute;left:18px;top:14px;z-index:2}
.tagline{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;color:var(--cyan)}
.greet{font-size:21px;font-weight:600;margin-top:8px;line-height:1.3}
.greet span{color:var(--cyan)}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.user-card{position:absolute;left:18px;top:14px;z-index:2;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 0 12px rgba(35,213,255,.15)}
.user-card img{width:40px;height:40px;border-radius:9px;object-fit:cover;object-position:center 20%;border:1px solid var(--cyan)}
.user-name{font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:1px;color:var(--muted)}
.user-name span{color:var(--text);font-weight:700}
.clock{position:absolute;right:18px;top:14px;text-align:right;z-index:2}
.clock .time{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:500;text-shadow:0 0 14px rgba(35,213,255,.6)}
.clock .date{font-size:11.5px;margin-top:2px}
.clock .tz{font-size:10px;color:var(--cyan)}
#globe{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:560px;height:560px;max-width:none}
.hero-title{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:22px;letter-spacing:10px;color:#dff7ff;text-shadow:0 0 14px var(--cyan);z-index:2}

/* voice commander */
.voice{display:flex;flex-direction:column;align-items:center;margin-top:-6px;position:relative;z-index:3}
.mic{width:76px;height:76px;border-radius:50%;border:2px solid var(--mint);background:radial-gradient(circle,rgba(63,245,216,.45) 0%,rgba(35,213,255,.2) 55%,rgba(5,24,46,.95) 100%);color:var(--mint);font-size:26px;cursor:pointer;box-shadow:0 0 22px rgba(63,245,216,.5),inset 0 0 12px rgba(63,245,216,.35);transition:all .25s}
.mic:hover{transform:scale(1.06)}
.mic.listening{background:var(--mint);color:#020813;box-shadow:0 0 40px var(--mint),0 0 60px rgba(63,245,216,.7);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px;text-align:center}
.reply{margin-top:10px;display:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(4,18,34,.85);font-size:13px;line-height:1.6;width:100%}
.reply.show{display:block}
.reply strong{color:var(--mint)}
.textin{position:relative;width:100%;margin-top:10px}
.textin input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(4,18,34,.9);color:var(--text);font-family:inherit;font-size:14px;padding:0 48px 0 16px;outline:none}
.textin input::placeholder{color:var(--muted)}
.textin button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--cyan);font-size:16px;cursor:pointer}

/* music: plays MP3 files from the music/ folder */
const TRACKS=[
  {name:'Fun Song 1', file:'music/song1.mp3', sub:'Fun song for PIPOOH'},
  {name:'Fun Song 2', file:'music/song2.mp3', sub:'Fun song for PIPOOH'},
  {name:'Fun Song 3', file:'music/song3.mp3', sub:'Fun song for PIPOOH'},
  {name:'Fun Song 4', file:'music/song4.mp3', sub:'Fun song for PIPOOH'},
  {name:'Fun Song 5', file:'music/song5.mp3', sub:'Fun song for PIPOOH'}
];
const audio=new Audio();
audio.preload='metadata';
audio.volume=0.6;
let ti=0, playing=false;

function ensureAudio(){ /* kept so the mic code still works */ }
function fmt(s){
  if(!isFinite(s)) return '00:00';
  return `${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}`;
}
function setPlayUI(on){
  $('playIcon').className=on?'fas fa-pause':'fas fa-play';
  $('playBtn').setAttribute('aria-label',on?'pause':'play');
  $('eq').parentElement.classList.toggle('playing',on);
}
function loadTrack(i,autoplay){
  ti=(i+TRACKS.length)%TRACKS.length;
  const t=TRACKS[ti];
  audio.src=t.file;
  $('trackTitle').textContent=t.name;
  $('trackSub').textContent=t.sub;
  $('seekFill').style.width='0%';
  $('cur').textContent='00:00';
  $('dur').textContent='00:00';
  document.querySelectorAll('.tchip').forEach((b,k)=>b.classList.toggle('on',k===ti));
  if(autoplay) startPlay();
}
function startPlay(){
  audio.play().catch(()=>{ $('status').textContent='Tap play to start the music.'; });
}
function stopPlay(){ audio.pause(); }
function togglePlay(){ playing?stopPlay():startPlay(); }
function nextTrack(){ loadTrack(ti+1, playing); }
function prevTrack(){ loadTrack(ti-1, playing); }
function selectTrack(i){ loadTrack(i,true); }
function seekTo(e){
  const r=$('seek').getBoundingClientRect();
  const p=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);
  if(audio.duration) audio.currentTime=p*audio.duration;
}
function pulseBack(){ audio.currentTime=Math.max(0,audio.currentTime-5); }
function pulseFwd(){ audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5); }
function setVolume(v){
  $('volText').textContent=v;
  audio.volume=v/100;
}

audio.addEventListener('play',()=>{ playing=true; setPlayUI(true); });
audio.addEventListener('pause',()=>{ playing=false; setPlayUI(false); });
audio.addEventListener('loadedmetadata',()=>{ $('dur').textContent=fmt(audio.duration); });
audio.addEventListener('timeupdate',()=>{
  $('cur').textContent=fmt(audio.currentTime);
  $('seekFill').style.width=(audio.currentTime/(audio.duration||1)*100)+'%';
});
audio.addEventListener('ended',()=>loadTrack(ti+1,true));

/* voice commander + text commands */
  // เสียงที่ต้องการ (ผู้ชาย) ถ้าเครื่องไม่มี ระบบจะใช้ตัวสำรองตามลำดับ
const PREFERRED_VOICES = [
  'Microsoft Mark - English (United States)',
  'Microsoft Guy Online (Natural) - English (United States)',
  'Microsoft David',
  'Google UK English Male',
  'Daniel',
  'Google US English'
];
const VOICE_KEY = 'bus_voice_name_v3';

function pickEnglishVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return null;

  const saved = localStorage.getItem(VOICE_KEY);
  if(saved){
    const found = vs.find(v => v.name === saved);
    if(found) return found;
  }

  let chosen = null;
  for(const name of PREFERRED_VOICES){
    chosen = vs.find(v => v.name === name || v.name.startsWith(name + ' ('));
    if(chosen) break;
  }
  if(!chosen) chosen = vs.find(v => v.lang === 'en-US') || vs.find(v => v.lang.startsWith('en'));
  if(chosen) localStorage.setItem(VOICE_KEY, chosen.name);
  return chosen;
}
  
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  const v=pickEnglishVoice(); if(v) u.voice=v;
  u.rate=1; u.pitch=1.05;
  u.onstart=()=>{$('status').textContent='B.U.S. is speaking... tap the mic to stop';};
  u.onend=u.onerror=()=>{ if(!listening) $('status').textContent=IDLE; };
  speechSynthesis.speak(u);
}

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => pickEnglishVoice();
}
function showReply(html){const r=$('reply');r.innerHTML=html;r.classList.add('show');}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setVol(delta){
  const el=document.querySelector('.vol input');
  el.value=Math.min(100,Math.max(0,+el.value+delta));setVolume(el.value);
  return `ระดับเสียง ${el.value} ครับ`;
}
function handleCommand(raw){
  const text=(raw||'').trim().slice(0,300);
  if(!text) return;
  $('q').value='';   const en=text.toLowerCase();
  const say=(msg)=>{
    showReply(`<strong>PIPOOH:</strong> ${escapeHtml(text)}<br><strong>B.U.S.:</strong> ${msg}`);
    speak(msg);
  };
  if(/\b(play|start|turn on)\b/.test(en) && /\b(music|song|songs|tune|track)\b/.test(en)){
    if(!playing) startPlay();
    return say(`Playing ${TRACKS[ti].name} now!`);
  }
  if(/\bplay\b/.test(en) && !/\b(game|video)\b/.test(en)){
    if(!playing) startPlay();
    return say(`Playing ${TRACKS[ti].name} now!`);
  }
  if(/\b(pause|stop|turn off)\b/.test(en) && /\b(music|song|it|that)?\b/.test(en)){
    stopPlay();
    return say('Music paused.');
  }
  if(/\b(next|skip|another)\b/.test(en)){
    nextTrack();
    return say(`Next song: ${TRACKS[ti].name}.`);
  }
  if(/\b(previous|back|last song)\b/.test(en)){
    prevTrack();
    return say(`Going back to ${TRACKS[ti].name}.`);
  }
  if(/\b(louder|volume up|turn up)\b/.test(en)){
    return say(setVol(10).replace(/[^\d]/g,'') ? `Volume is now ${$('volText').textContent}.` : 'Volume up.');
  }
  if(/\b(softer|quieter|volume down|turn down)\b/.test(en)){
    return say(setVol(-10).replace(/[^\d]/g,'') ? `Volume is now ${$('volText').textContent}.` : 'Volume down.');
  }
  if(/\b(what time|time is it)\b/.test(en)){
    return say(`It is ${$('clock').textContent} right now.`);
  }
  if(/\b(what day|what date|today)\b/.test(en)){
    return say($('thaiDate').textContent.replace(/^\S+\s/,'') ? `Today is ${new Date().toDateString()}.` : 'Today is a nice day!');
  }
  if(/\b(hi|hello|hey)\b/.test(en)){
    return say('Hi PIPOOH! B.U.S. is happy to see you. What do you want to do today?');
  }
  const t=text.replace(/\s+/g,'');
  const now=new Date();
  let ans;
  if(/เล่นเพลง|เปิดเพลง|เล่นต่อ/.test(t)){ if(!playing)startPlay(); ans=`กำลังเล่น ${TRACKS[ti].name} ครับ`; }
  else if(/หยุดเพลง|พักเพลง|หยุดก่อน/.test(t)){ stopPlay(); ans='หยุดเพลงแล้วครับ'; }
  else if(/เพลงถัดไป|เพลงต่อไป|ข้ามเพลง/.test(t)){ nextTrack(); ans=`เปลี่ยนเป็น ${TRACKS[ti].name} ครับ`; }
  else if(/เพลงก่อน/.test(t)){ prevTrack(); ans=`เปลี่ยนเป็น ${TRACKS[ti].name} ครับ`; }
  else if(/เสียงดังขึ้น|เพิ่มเสียง|ดังขึ้น/.test(t)) ans=setVol(10);
  else if(/เสียงเบาลง|ลดเสียง|เบาลง/.test(t)) ans=setVol(-10);
  else if(/กี่โมง|เวลา/.test(t)) ans=`ตอนนี้เวลา ${$('clock').textContent} น. ครับ`;
  else if(/วันอะไร|วันที่/.test(t)) ans=`วันนี้วัน${thDays[now.getDay()]} ที่ ${now.getDate()} ${thMonths[now.getMonth()]} ${now.getFullYear()+543} ครับ`;
  else if(/สวัสดี|หวัดดี/.test(t)) ans='สวัสดีครับ น้อง พิภูข์! มีอะไรให้พี่บัสช่วยครับ';
  else { askAI(text); return; }
  showReply(`<strong>น้อง PIPOOH:</strong> ${escapeHtml(text)}<br><strong>B.U.S.:</strong> ${ans}`);
  speak(ans);
}
const chatHistory = [];
async function askAI(text){
  $('status').textContent='B.U.S. is thinking...';
  showReply(`<strong>PIPOOH:</strong> ${escapeHtml(text)}<br><strong>B.U.S.:</strong> ...`);
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),20000);
  let ans;
  try{
    const res=await fetch('/.netlify/functions/chat',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({message:text,history:chatHistory}),
      signal:ctrl.signal
    });
    const data=await res.json();
    ans=data.reply||'Sorry PIPOOH, B.U.S. is taking a little break. Please try again!';
    chatHistory.push({role:'user',content:text},{role:'assistant',content:ans});
    if(chatHistory.length>20) chatHistory.splice(0,chatHistory.length-20);
  }catch(e){
    ans='Sorry PIPOOH, B.U.S. is taking a little break. Please try again in a moment!';
  }finally{
    clearTimeout(timer);
  }
  showReply(`<strong>PIPOOH:</strong> ${escapeHtml(text)}<br><strong>B.U.S.:</strong> ${escapeHtml(ans)}`);
  speak(ans);
}  
}
let rec=null,listening=false;
function toggleMic(){
  if(speechSynthesis.speaking){
    speechSynthesis.cancel();
    $('status').textContent=IDLE;
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ $('status').textContent='This browser cannot listen. Please type below.'; return; }
  if(listening){ rec&&rec.stop(); return; }
  ensureAudio();
  rec=new SR();
  rec.lang='en-US'; rec.continuous=false; rec.interimResults=false;
  rec.onstart=()=>{ listening=true; $('mic').classList.add('listening'); $('status').textContent='Listening... go ahead!'; };
  rec.onresult=e=>handleCommand(e.results[0][0].transcript);
  rec.onerror=()=>{ $('status').textContent='I did not catch that. Tap the mic and try again.'; };
  rec.onend=()=>{
    listening=false;
    $('mic').classList.remove('listening');
    if($('status').textContent.startsWith('Listening')) $('status').textContent=IDLE;
  };
  rec.start();
}

function goTab(tab,btn){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='home') window.scrollTo({top:0,behavior:'smooth'});
  else if(tab==='voice'){ window.scrollTo({top:0,behavior:'smooth'}); toggleMic(); }
  else if(tab==='music') $('music').scrollIntoView({behavior:'smooth',block:'start'});
  else toast('การตั้งค่ากำลังพัฒนาครับ');
}

$('trackList').innerHTML=TRACKS.map((t,i)=>`<button class="tchip" onclick="selectTrack(${i})">${t.name}</button>`).join('');
loadTrack(0);
</script>
</body>
