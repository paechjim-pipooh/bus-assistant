<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B.U.S. assist PIPOOH</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cyan:#23d5ff;--mint:#3ff5d8;--line:rgba(35,213,255,.35);--muted:#7fb6d6;--text:#eaf8ff;--panel:rgba(6,22,40,.72);--soft:rgba(35,213,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',system-ui,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 15% 12%,rgba(120,60,200,.28),transparent 45%),radial-gradient(ellipse at 88% 55%,rgba(20,130,220,.22),transparent 50%),radial-gradient(ellipse at top,#0b1a3a,#02040c 70%) #02040c}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:10px 14px 110px}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0 12px}
.icon-btn{width:36px;height:36px;border:none;background:none;color:var(--cyan);font-size:20px;cursor:pointer;border-radius:10px}
.brand{text-align:center}
.brand h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;letter-spacing:9px;text-shadow:0 0 12px rgba(35,213,255,.7)}
.brand p{font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:3px;color:var(--muted);margin-top:2px}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--cyan);display:grid;place-items:center;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--cyan)}

/* hero + globe */
.hero{position:relative;height:500px;margin:0 -14px}
.user-card{position:absolute;left:18px;top:8px;z-index:2;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.user-card img{width:40px;height:40px;border-radius:9px;object-fit:cover;object-position:center 20%;border:1px solid var(--cyan)}
.user-name{font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:1px;color:var(--muted)}
.user-name span{color:var(--text);font-weight:700}
.clock{position:absolute;right:18px;top:8px;z-index:2;text-align:right}
.clock .time{font-family:'Orbitron',sans-serif;font-size:28px;text-shadow:0 0 14px rgba(35,213,255,.6)}
.clock .date{font-size:11.5px}
.clock .tz{font-size:10px;color:var(--cyan)}
#globe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,500px);height:min(96vw,500px)}
.hero-title{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:22px;letter-spacing:10px;text-shadow:0 0 14px var(--cyan);z-index:2}

/* voice */
.voice{display:flex;flex-direction:column;align-items:center;margin-top:-10px;position:relative;z-index:3}
.mic{width:76px;height:76px;border-radius:50%;border:2px solid var(--mint);background:radial-gradient(circle,rgba(63,245,216,.45),rgba(35,213,255,.2) 55%,rgba(5,24,46,.95));color:var(--mint);font-size:26px;cursor:pointer;box-shadow:0 0 22px rgba(63,245,216,.5)}
.mic.listening{background:var(--mint);color:#020813;box-shadow:0 0 40px var(--mint);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px;text-align:center}
.reply{display:none;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(4,18,34,.85);font-size:13px;line-height:1.6}
.reply.show{display:block}
.reply strong{color:var(--mint)}
.textin{position:relative;width:100%;margin-top:10px}
.textin input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(4,18,34,.9);color:var(--text);font:inherit;font-size:14px;padding:0 48px 0 16px;outline:none}
.textin input::placeholder{color:var(--muted)}
.textin button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--cyan);font-size:16px;cursor:pointer}

/* compact music panel */
.panel{margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 11px}
.panel-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:6px}
.panel-head i{color:var(--cyan)}
.eq{margin-left:auto;display:flex;align-items:flex-end;gap:3px;height:18px}
.eq i{width:3px;height:4px;background:var(--cyan);border-radius:2px}
.eq.playing i{animation:bounce .4s infinite alternate}
.eq.playing i:nth-child(2){animation-delay:.15s}
.eq.playing i:nth-child(3){animation-delay:.3s}
.eq.playing i:nth-child(4){animation-delay:.1s}
@keyframes bounce{to{height:16px;background:var(--mint)}}
.track{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-track{font-size:11.5px;color:var(--muted);margin-top:2px}
.seek{height:5px;background:rgba(35,213,255,.12);border-radius:4px;margin-top:8px;cursor:pointer;position:relative;overflow:hidden}
.seek i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#1ea8d6,var(--mint))}
.times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ctl{background:none;border:1px solid var(--line);color:var(--cyan);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:11px}
.ctl.main{width:40px;height:40px;background:linear-gradient(135deg,var(--cyan),var(--mint));color:#020813;border:none;font-size:18px}
.vol{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--cyan)}
.vol input{flex:1;accent-color:#23d5ff}
.tracks{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tchip{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer;font-family:inherit}
.tchip.on{background:var(--soft);border-color:var(--mint);color:var(--mint)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:72px;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around;align-items:center;background:rgba(3,10,20,.94);border-top:1px solid var(--line);z-index:10}
.nav button{background:none;border:none;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 10px;border-radius:12px;min-width:70px}
.nav button i{font-size:19px}
.nav button.active{color:var(--mint);border:1px solid var(--line);background:rgba(35,213,255,.08)}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(6,22,40,.95);border:1px solid var(--cyan);padding:8px 14px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="app">
  <header class="topbar">
    <button class="icon-btn" aria-label="menu" onclick="toast('Menu coming soon')"><i class="fas fa-bars"></i></button>
    <div class="brand"><h1>B.U.S.</h1><p>AI ASSIST FOR PIPOOH</p></div>
    <div class="avatar">PP</div>
  </header>

  <section class="hero">
    <div class="user-card">
      <img src="pipooh.jpg" alt="PIPOOH">
      <div class="user-name">USER : <span>PIPOOH JIM</span></div>
    </div>
    <div class="clock">
      <div class="time" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="tz">Thai time · UTC+7</div>
    </div>
    <canvas id="globe" width="700" height="700"></canvas>
    <div class="hero-title">B.U.S.</div>
  </section>

  <section class="voice">
    <button class="mic" id="mic" aria-label="Talk to B.U.S." onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
    <div class="status" id="status">Tap the mic and talk to B.U.S.</div>
    <div class="reply" id="reply"></div>
    <div class="textin">
      <input id="q" type="text" placeholder="Or type here..." onkeydown="if(event.key==='Enter')handleText(this.value)">
      <button aria-label="send" onclick="handleText(document.getElementById('q').value)"><i class="fas fa-paper-plane"></i></button>
    </div>
  </section>

  <section class="panel" id="music">
    <div class="panel-head"><i class="fas fa-compact-disc"></i> Music <div class="eq" id="eq"><i></i><i></i><i></i><i></i></div></div>
    <div class="track" id="trackTitle"></div>
    <div class="sub-track" id="trackSub"></div>
    <div class="seek" id="seek"><i id="seekFill"></i></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button class="ctl" aria-label="previous" onclick="prevTrack()"><i class="fas fa-backward-step"></i></button>
      <button class="ctl" aria-label="back 5 seconds" onclick="jump(-5)"><i class="fas fa-rotate-left"></i></button>
      <button class="ctl main" id="playBtn" aria-label="play" onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></button>
      <button class="ctl" aria-label="forward 5 seconds" onclick="jump(5)"><i class="fas fa-rotate-right"></i></button>
      <button class="ctl" aria-label="next" onclick="nextTrack()"><i class="fas fa-forward-step"></i></button>
    </div>
    <div class="vol"><i class="fas fa-volume-high"></i><input type="range" id="vol" min="0" max="100" value="60"><span id="volText">60</span></div>
    <div class="tracks" id="trackList"></div>
    <div class="tracks" id="linkList"></div>
  </section>
</div>

<nav class="nav">
  <button class="active" onclick="goTab('home',this)"><i class="fas fa-house"></i>Home</button>
  <button onclick="goTab('voice',this)"><i class="fas fa-microphone"></i>Voice</button>
  <button onclick="goTab('music',this)"><i class="fas fa-music"></i>Music</button>
  <button onclick="goTab('settings',this)"><i class="fas fa-gear"></i>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- settings ---------- */
const PLAYLISTS = [
  { name: 'Spotify', icon: 'fab fa-spotify', url: 'https://open.spotify.com/playlist/REPLACE_ME' },
  { name: 'YouTube', icon: 'fab fa-youtube', url: 'https://www.youtube.com/playlist?list=REPLACE_ME' }
];
const TRACKS = [
  { name: 'Fun Song 1', file: 'music/song1.mp3' },
  { name: 'Fun Song 2', file: 'music/song2.mp3' },
  { name: 'Fun Song 3', file: 'music/song3.mp3' },
  { name: 'Fun Song 4', file: 'music/song4.mp3' },
  { name: 'Fun Song 5', file: 'music/song5.mp3' }
];
const PREFERRED_VOICES = ['Microsoft Mark', 'Microsoft Guy Online', 'Microsoft David', 'Aaron', 'Daniel', 'Google US English'];
const VOICE_KEY = 'bus_voice_v4';
const IDLE = 'Tap the mic and talk to B.U.S.';
const LISTEN = 'Listening... go ahead!';
const FALLBACK = 'Sorry PIPOOH, B.U.S. is taking a little break. Please try again!';
const TH_DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const TH_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const setStatus = t => { $('status').textContent = t; };
const escapeHtml = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function showReply(user, busHtml){
  $('reply').innerHTML = `<strong>PIPOOH:</strong> ${escapeHtml(user)}<br><strong>B.U.S.:</strong> ${busHtml}`;
  $('reply').classList.add('show');
}
function goTab(tab, btn){
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if(tab === 'home') window.scrollTo({top:0, behavior:'smooth'});
  else if(tab === 'voice'){ window.scrollTo({top:0, behavior:'smooth'}); toggleMic(); }
  else if(tab === 'music') $('music').scrollIntoView({behavior:'smooth', block:'start'});
  else toast('Settings coming soon');
}

/* ---------- clock ---------- */
function tick(){
  const n = new Date();
  $('clock').textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  $('date').textContent = `${TH_DAYS[n.getDay()]} ${n.getDate()} ${TH_MONTHS[n.getMonth()]} ${n.getFullYear()+543}`;
}

/* ---------- starfield background ---------- */
(function(){
  const c = $('stars'), x = c.getContext('2d');
  let w, h, S = [];
  function size(){
    w = c.width = innerWidth; h = c.height = innerHeight;
    S = Array.from({length: Math.round(w*h/2800)}, () => ({
      x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.3+0.2,
      s: Math.random()*0.02+0.004, a: Math.random()*6
    }));
  }
  size(); addEventListener('resize', size);
  (function frame(){
    x.clearRect(0,0,w,h);
    for(const s of S){
      s.a += s.s;
      x.globalAlpha = 0.35 + 0.65*Math.abs(Math.sin(s.a));
      x.fillStyle = s.r > 1.1 ? '#cdf6ff' : '#ffffff';
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI*2); x.fill();
    }
    x.globalAlpha = 1;
    requestAnimationFrame(frame);
  })();
})();

/* ---------- rotating globe ---------- */
const cv = $('globe'), g = cv.getContext('2d');
const P = [];
for(let i = 0; i < 700; i++){
  const y = 1 - (i/699)*2, r = Math.sqrt(1 - y*y), th = Math.PI*(3 - Math.sqrt(5))*i;
  P.push([Math.cos(th)*r, y, Math.sin(th)*r]);
}
let rot = 0, sat = 0;
function drawGlobe(){
  const W = cv.width, C = W/2, R = W*0.25;
  g.clearRect(0,0,W,W);
  const halo = g.createRadialGradient(C,C,R*0.6,C,C,R*1.6);
  halo.addColorStop(0,'rgba(35,213,255,0.2)'); halo.addColorStop(1,'rgba(35,213,255,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(C,C,R*1.6,0,Math.PI*2); g.fill();

  rot += 0.004;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for(const [x0, y0, z0] of P){
    const x = x0*cr + z0*sr, z = -x0*sr + z0*cr, d = (z+1)/2;
    g.fillStyle = `rgba(${d>0.5 ? '140,240,255' : '35,180,255'},${0.25+d*0.75})`;
    g.beginPath(); g.arc(C + x*R, C + y0*R, 1.6+d*1.4, 0, Math.PI*2); g.fill();
  }
  g.lineWidth = 1;
  for(let k = 1; k <= 5; k++){
    const lat = (k/6)*Math.PI - Math.PI/2;
    g.beginPath();
    for(let s = 0; s <= 72; s++){
      const lon = (s/72)*Math.PI*2 + rot;
      const px = C + Math.cos(lat)*Math.cos(lon)*R, py = C + Math.sin(lat)*R;
      s ? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.strokeStyle = 'rgba(35,213,255,0.14)'; g.stroke();
  }
  g.save(); g.translate(C,C); g.rotate(-0.25); g.scale(1,0.32);
  g.beginPath(); g.arc(0,0,R*1.45,0,Math.PI*2);
  g.strokeStyle = 'rgba(63,245,216,0.7)'; g.lineWidth = 3;
  g.shadowColor = '#23d5ff'; g.shadowBlur = 14; g.stroke();
  g.restore();

  sat += 0.02;
  const ex = Math.cos(sat)*R*1.45, ey = Math.sin(sat)*R*1.45*0.32;
  const c = Math.cos(-0.25), s2 = Math.sin(-0.25);
  g.shadowBlur = 20; g.shadowColor = '#3ff5d8'; g.fillStyle = '#e6fffb';
  g.beginPath(); g.arc(C + ex*c - ey*s2, C + ex*s2 + ey*c, 5, 0, Math.PI*2); g.fill();
  g.shadowBlur = 0;
  requestAnimationFrame(drawGlobe);
}

/* ---------- music (real MP3 files from music/ folder) ---------- */
const audio = new Audio();
audio.preload = 'metadata';
audio.volume = 0.6;
let ti = 0;
const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${pad(Math.floor(s%60))}` : '0:00';

function setTrack(i, autoplay){
  ti = (i + TRACKS.length) % TRACKS.length;
  audio.src = TRACKS[ti].file;
  $('trackTitle').textContent = TRACKS[ti].name;
  $('trackSub').textContent = 'Fun song for PIPOOH';
  $('cur').textContent = '0:00'; $('dur').textContent = '0:00';
  $('seekFill').style.width = '0%';
  document.querySelectorAll('#trackList button').forEach((b,k) => b.classList.toggle('on', k === ti));
  if(autoplay) audio.play().catch(() => setStatus('Tap play to start the music.'));
}
function togglePlay(){
  if(audio.paused) audio.play().catch(() => setStatus('Tap play to start the music.'));
  else audio.pause();
}
function nextTrack(){ setTrack(ti+1, !audio.paused); }
function prevTrack(){ setTrack(ti-1, !audio.paused); }
function jump(sec){
  const end = audio.duration || Infinity;
  audio.currentTime = Math.max(0, Math.min(end, audio.currentTime + sec));
}
function changeVol(delta){
  const v = Math.max(0, Math.min(100, +$('vol').value + delta));
  $('vol').value = v; $('volText').textContent = v; audio.volume = v/100;
}
function openPlaylist(i){ window.open(PLAYLISTS[i].url, '_blank', 'noopener'); }

audio.onplay = () => { $('playIcon').className = 'fas fa-pause'; $('eq').classList.add('playing'); };
audio.onpause = () => { $('playIcon').className = 'fas fa-play'; $('eq').classList.remove('playing'); };
audio.onloadedmetadata = () => { $('dur').textContent = fmt(audio.duration); };
audio.ontimeupdate = () => {
  $('cur').textContent = fmt(audio.currentTime);
  $('seekFill').style.width = (audio.currentTime / (audio.duration || 1) * 100) + '%';
};
audio.onended = () => setTrack(ti+1, true);
audio.onerror = () => setStatus('Song file not found in the music folder.');

$('seek').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  const p = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  if(audio.duration) audio.currentTime = p * audio.duration;
};
$('vol').oninput = e => { $('volText').textContent = e.target.value; audio.volume = e.target.value/100; };
$('trackList').innerHTML = TRACKS.map((t,i) => `<button class="tchip" type="button">Song ${i+1}</button>`).join('');
$('trackList').onclick = e => {
  const i = [...$('trackList').children].indexOf(e.target.closest('button'));
  if(i >= 0) setTrack(i, true);
};
$('linkList').innerHTML = PLAYLISTS.map((p,i) =>
  `<button class="tchip" type="button" onclick="openPlaylist(${i})"><i class="${p.icon}"></i> ${p.name}</button>`).join('');

/* ---------- voice output (English, locked voice) ---------- */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return null;
  const saved = localStorage.getItem(VOICE_KEY);
  if(saved){ const f = vs.find(v => v.name === saved); if(f) return f; }
  let c = null;
  for(const n of PREFERRED_VOICES){
    c = vs.find(v => v.name === n || v.name.startsWith(n + ' (') || v.name.startsWith(n + ' -'));
    if(c) break;
  }
  if(!c) c = vs.find(v => v.lang === 'en-US') || vs.find(v => v.lang.startsWith('en'));
  if(c) localStorage.setItem(VOICE_KEY, c.name);
  return c;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 1; u.pitch = 1.05;
  voice = voice || pickVoice();
  if(voice) u.voice = voice;
  u.onstart = () => setStatus('B.U.S. is speaking... tap the mic to stop');
  u.onend = u.onerror = () => { if(!listening) setStatus(IDLE); };
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };

/* ---------- voice input (mic) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function toggleMic(){
  if('speechSynthesis' in window && speechSynthesis.speaking){
    speechSynthesis.cancel(); setStatus(IDLE); return;
  }
  if(!SR){ setStatus('Voice is not supported here. Please type below.'); return; }
  if(listening){ rec.stop(); return; }
  rec = new SR();
  rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = false;
  rec.onstart = () => {
    listening = true;
    $('mic').classList.add('listening');
    audio.volume = 0.15; // lower music so the mic hears the child clearly
    setStatus(LISTEN);
  };
  rec.onresult = e => handleText(e.results[0][0].transcript);
  rec.onerror = () => setStatus("I didn't catch that. Tap the mic and try again.");
  rec.onend = () => {
    listening = false;
    $('mic').classList.remove('listening');
    audio.volume = $('vol').value / 100;
    if($('status').textContent === LISTEN) setStatus(IDLE);
  };
  rec.start();
}

/* ---------- commands and AI ---------- */
function showLink(user, name, url){
  showReply(user, `Tap to open ${name}: <a href="${url}" target="_blank" rel="noopener" style="color:#3ff5d8">Open ${name}</a>`);
  speak(`Tap the link to open ${name}.`);
}
const chatHistory = [];
async function askAI(text){
  setStatus('B.U.S. is thinking...');
  showReply(text, '...');
  let ans;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try{
    const res = await fetch('/api/chat, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: text, history: chatHistory }),
      signal: ctrl.signal
    });
    const data = await res.json();
    ans = data.reply || FALLBACK;
    chatHistory.push({role:'user', content:text}, {role:'assistant', content:ans});
    if(chatHistory.length > 20) chatHistory.splice(0, chatHistory.length - 20);
  }catch(e){
    ans = FALLBACK;
  }finally{
    clearTimeout(timer);
  }
  showReply(text, escapeHtml(ans));
  speak(ans);
}
function handleText(raw){
  const text = (raw || '').trim().slice(0, 300);
  if(!text) return;
  $('q').value = '';
  const t = text.toLowerCase();
  const say = msg => { showReply(text, escapeHtml(msg)); speak(msg); };

  if(/\bspotify\b/.test(t)) return showLink(text, 'Spotify', 'https://open.spotify.com/');
  if(/\byoutube\b/.test(t)) return showLink(text, 'YouTube', 'https://www.youtube.com/');
  if(/\b(play|start|resume)\b/.test(t) && !/\bgame\b/.test(t)){
    if(audio.paused) audio.play().catch(() => {});
    return say(`Playing ${TRACKS[ti].name} now!`);
  }
  if(/\b(pause|stop)\b/.test(t)){ audio.pause(); return say('Music paused.'); }
  if(/\b(next|skip|another)\b/.test(t)){ nextTrack(); return say(`Next song: ${TRACKS[ti].name}.`); }
  if(/\b(back|previous|last)\b/.test(t)){ prevTrack(); return say(`Going back to ${TRACKS[ti].name}.`); }
  if(/\b(louder|volume up|turn up)\b/.test(t)){ changeVol(10); return say(`Volume is now ${$('vol').value}.`); }
  if(/\b(softer|quieter|volume down|turn down)\b/.test(t)){ changeVol(-10); return say(`Volume is now ${$('vol').value}.`); }
  if(/\b(time|clock)\b/.test(t)) return say(`It is ${$('clock').textContent} now.`);
  if(/\b(date|today|what day)\b/.test(t)){
    return say('Today is ' + new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'}) + '.');
  }
  if(/^(hi|hello|hey)\b/.test(t)) return say('Hi PIPOOH! B.U.S. is happy to see you. What do you want to do today?');
  return askAI(text);
}

/* ---------- start ---------- */
setTrack(0, false);
tick(); setInterval(tick, 1000);
drawGlobe();
